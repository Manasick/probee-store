<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="referrer"
        content="no-referrer"
    >

    <title>Admin Dashboard | ProBee</title>

    <!-- =====================================================
         SUPABASE
    ====================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        /* =====================================================
           RESET
        ====================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                #080808;

            color:
                #f5f5f5;

            min-height: 100vh;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        /* =====================================================
           VARIABLES
        ====================================================== */

        :root {
            --gold: #d4af37;
            --gold-light: #f0d878;
            --bg: #080808;
            --card: #111111;
            --card-2: #151515;
            --border: #292929;
            --muted: #999999;
            --danger: #ff5757;
            --success: #42d392;
            --warning: #e6b84a;
            --blue: #5aa9ff;
        }

        /* =====================================================
           LOGIN SCREEN
        ====================================================== */

        #loginScreen {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                radial-gradient(
                    circle at top,
                    #1a1608 0%,
                    #080808 45%,
                    #050505 100%
                );
        }

        .login-card {
            width: 100%;
            max-width: 430px;

            background:
                rgba(17, 17, 17, 0.96);

            border:
                1px solid var(--border);

            border-radius: 24px;

            padding: 35px 28px;

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.55);
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-logo {
            width: 62px;
            height: 62px;

            margin: 0 auto 15px;

            border-radius: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    var(--gold),
                    #8c6d13
                );

            color: #090909;

            font-size: 28px;
            font-weight: 900;

            box-shadow:
                0 10px 35px rgba(212, 175, 55, 0.2);
        }

        .brand h1 {
            font-size: 28px;
            letter-spacing: 1px;
        }

        .brand h1 span {
            color: var(--gold);
        }

        .brand p {
            margin-top: 7px;
            color: var(--muted);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            color: #d7d7d7;

            font-size: 13px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;

            padding: 14px 15px;

            border:
                1px solid var(--border);

            border-radius: 12px;

            background: #0b0b0b;

            color: white;

            outline: none;

            transition:
                border-color 0.2s,
                box-shadow 0.2s;
        }

        .form-group input:focus {
            border-color: var(--gold);

            box-shadow:
                0 0 0 3px
                rgba(212, 175, 55, 0.08);
        }

        .login-btn {
            width: 100%;

            border: none;

            padding: 14px;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    var(--gold-light),
                    var(--gold)
                );

            color: #080808;

            font-weight: 800;

            margin-top: 5px;

            transition:
                transform 0.2s,
                opacity 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-1px);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #loginMessage {
            min-height: 22px;

            margin-top: 14px;

            text-align: center;

            font-size: 13px;
        }

        .error {
            color: var(--danger);
        }

        .success {
            color: var(--success);
        }

        /* =====================================================
           DASHBOARD
        ====================================================== */

        #dashboard {
            display: none;
            min-height: 100vh;
        }

        /* =====================================================
           HEADER
        ====================================================== */

        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;

            height: 72px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 28px;

            background:
                rgba(8, 8, 8, 0.94);

            backdrop-filter:
                blur(18px);

            border-bottom:
                1px solid var(--border);
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mini-logo {
            width: 40px;
            height: 40px;

            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    var(--gold),
                    #8c6d13
                );

            color: #080808;

            font-weight: 900;
        }

        .topbar-title {
            font-size: 18px;
            font-weight: 800;
        }

        .topbar-title span {
            color: var(--gold);
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .admin-email {
            color: var(--muted);
            font-size: 12px;
        }

        .logout-btn {
            border:
                1px solid #3a3a3a;

            background:
                #111;

            color:
                #ddd;

            border-radius: 10px;

            padding:
                9px 13px;

            font-size: 12px;

            transition:
                border-color 0.2s;
        }

        .logout-btn:hover {
            border-color: var(--danger);
            color: white;
        }

        /* =====================================================
           MAIN
        ====================================================== */

        .main {
            max-width: 1450px;

            margin: 0 auto;

            padding:
                28px;
        }

        .page-heading {
            margin-bottom: 25px;
        }

        .page-heading h2 {
            font-size: 30px;
        }

        .page-heading p {
            color: var(--muted);
            margin-top: 6px;
            font-size: 14px;
        }

        /* =====================================================
           STAT CARDS
        ====================================================== */

        .stats-grid {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

            margin-bottom: 24px;
        }

        .stat-card {
            background:
                linear-gradient(
                    145deg,
                    #151515,
                    #0e0e0e
                );

            border:
                1px solid var(--border);

            border-radius: 18px;

            padding: 20px;
        }

        .stat-label {
            color: var(--muted);

            font-size: 12px;

            text-transform:
                uppercase;

            letter-spacing:
                0.6px;
        }

        .stat-value {
            margin-top: 10px;

            font-size: 28px;

            font-weight: 850;
        }

        .stat-value.gold {
            color: var(--gold-light);
        }

        .stat-value.green {
            color: var(--success);
        }

        .stat-value.yellow {
            color: var(--warning);
        }

        .stat-value.blue {
            color: var(--blue);
        }

        /* =====================================================
           CONTROLS
        ====================================================== */

        .controls {
            display: flex;

            align-items: center;

            gap: 10px;

            flex-wrap: wrap;

            margin-bottom: 18px;
        }

        .search-box {
            flex: 1;

            min-width: 220px;
        }

        .search-box input,
        .filter-select {
            width: 100%;

            padding:
                12px 14px;

            background:
                #101010;

            color:
                white;

            border:
                1px solid var(--border);

            border-radius:
                11px;

            outline: none;
        }

        .search-box input:focus,
        .filter-select:focus {
            border-color:
                var(--gold);
        }

        .filter-select {
            width: auto;
            min-width: 155px;
        }

        .refresh-btn {
            border:
                1px solid var(--border);

            background:
                #121212;

            color:
                #eee;

            padding:
                12px 16px;

            border-radius:
                11px;
        }

        .refresh-btn:hover {
            border-color:
                var(--gold);
        }

        /* =====================================================
           ORDERS CARD
        ====================================================== */

        .orders-card {
            background:
                #101010;

            border:
                1px solid var(--border);

            border-radius:
                20px;

            overflow:
                hidden;
        }

        .orders-header {
            padding:
                18px 20px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            border-bottom:
                1px solid var(--border);
        }

        .orders-header h3 {
            font-size:
                17px;
        }

        .orders-count {
            color:
                var(--muted);

            font-size:
                12px;
        }

        /* =====================================================
           TABLE
        ====================================================== */

        .table-wrap {
            overflow-x:
                auto;
        }

        table {
            width:
                100%;

            border-collapse:
                collapse;

            min-width:
                1000px;
        }

        th {
            text-align:
                left;

            padding:
                14px 16px;

            font-size:
                11px;

            color:
                #888;

            text-transform:
                uppercase;

            letter-spacing:
                0.6px;

            background:
                #0c0c0c;

            border-bottom:
                1px solid var(--border);
        }

        td {
            padding:
                15px 16px;

            font-size:
                13px;

            border-bottom:
                1px solid #1d1d1d;

            vertical-align:
                top;
        }

        tr:last-child td {
            border-bottom:
                none;
        }

        tr:hover td {
            background:
                rgba(255, 255, 255, 0.015);
        }

        .order-number {
            color:
                var(--gold-light);

            font-weight:
                800;

            white-space:
                nowrap;
        }

        .customer-name {
            font-weight:
                700;
        }

        .muted {
            color:
                var(--muted);

            font-size:
                12px;

            margin-top:
                4px;
        }

        .items-list {
            max-width:
                250px;

            line-height:
                1.7;

            color:
                #ccc;

            font-size:
                12px;
        }

        .total {
            font-weight:
                800;

            white-space:
                nowrap;
        }

        /* =====================================================
           STATUS
        ====================================================== */

        .status-select {
            min-width:
                130px;

            padding:
                8px 10px;

            border-radius:
                9px;

            border:
                1px solid var(--border);

            background:
                #151515;

            color:
                white;

            outline:
                none;

            font-size:
                12px;
        }

        .status-select:focus {
            border-color:
                var(--gold);
        }

        .status-badge {
            display:
                inline-flex;

            align-items:
                center;

            padding:
                5px 9px;

            border-radius:
                30px;

            font-size:
                10px;

            font-weight:
                800;

            text-transform:
                uppercase;

            letter-spacing:
                0.5px;
        }

        .status-pending {
            color:
                #e8c96c;

            background:
                rgba(230, 184, 74, 0.1);

            border:
                1px solid rgba(230, 184, 74, 0.25);
        }

        .status-processing {
            color:
                #69b5ff;

            background:
                rgba(90, 169, 255, 0.1);

            border:
                1px solid rgba(90, 169, 255, 0.25);
        }

        .status-completed {
            color:
                #61dfa3;

            background:
                rgba(66, 211, 146, 0.1);

            border:
                1px solid rgba(66, 211, 146, 0.25);
        }

        .status-cancelled {
            color:
                #ff7373;

            background:
                rgba(255, 87, 87, 0.1);

            border:
                1px solid rgba(255, 87, 87, 0.25);
        }

        /* =====================================================
           EMPTY / LOADING
        ====================================================== */

        .state-box {
            padding:
                55px 20px;

            text-align:
                center;

            color:
                var(--muted);
        }

        .state-icon {
            font-size:
                35px;

            margin-bottom:
                10px;
        }

        /* =====================================================
           MODAL
        ====================================================== */

        .modal-overlay {
            position:
                fixed;

            inset:
                0;

            z-index:
                500;

            display:
                none;

            align-items:
                center;

            justify-content:
                center;

            padding:
                20px;

            background:
                rgba(0, 0, 0, 0.75);

            backdrop-filter:
                blur(7px);
        }

        .modal-overlay.show {
            display:
                flex;
        }

        .modal {
            width:
                100%;

            max-width:
                600px;

            max-height:
                90vh;

            overflow-y:
                auto;

            background:
                #111;

            border:
                1px solid var(--border);

            border-radius:
                20px;

            box-shadow:
                0 30px 100px
                rgba(0, 0, 0, 0.7);
        }

        .modal-header {
            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            padding:
                18px 20px;

            border-bottom:
                1px solid var(--border);
        }

        .modal-header h3 {
            font-size:
                17px;
        }

        .close-modal {
            width:
                34px;

            height:
                34px;

            border:
                1px solid var(--border);

            border-radius:
                10px;

            background:
                #181818;

            color:
                white;

            font-size:
                18px;
        }

        .modal-body {
            padding:
                20px;
        }

        .detail-grid {
            display:
                grid;

            grid-template-columns:
                1fr 1fr;

            gap:
                12px;

            margin-bottom:
                20px;
        }

        .detail-box {
            background:
                #0b0b0b;

            border:
                1px solid #202020;

            border-radius:
                12px;

            padding:
                13px;
        }

        .detail-box.full {
            grid-column:
                1 / -1;
        }

        .detail-label {
            color:
                #777;

            font-size:
                10px;

            text-transform:
                uppercase;

            letter-spacing:
                0.5px;

            margin-bottom:
                5px;
        }

        .detail-value {
            font-size:
                13px;

            color:
                #eee;

            word-break:
                break-word;
        }

        .modal-items {
            border:
                1px solid #222;

            border-radius:
                12px;

            overflow:
                hidden;
        }

        .modal-item {
            padding:
                12px 14px;

            border-bottom:
                1px solid #202020;

            display:
                flex;

            justify-content:
                space-between;

            gap:
                15px;

            font-size:
                12px;
        }

        .modal-item:last-child {
            border-bottom:
                none;
        }

        .modal-footer {
            padding:
                16px 20px;

            border-top:
                1px solid var(--border);

            display:
                flex;

            justify-content:
                flex-end;

            gap:
                10px;
        }

        .whatsapp-btn {
            border:
                none;

            background:
                #25d366;

            color:
                #071b0e;

            padding:
                10px 14px;

            border-radius:
                10px;

            font-weight:
                800;

            font-size:
                12px;
        }

        /* =====================================================
           RESPONSIVE
        ====================================================== */

        @media (max-width: 950px) {

            .stats-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }

        @media (max-width: 650px) {

            .topbar {
                padding:
                    0 15px;

                height:
                    65px;
            }

            .admin-email {
                display:
                    none;
            }

            .topbar-title {
                font-size:
                    16px;
            }

            .main {
                padding:
                    20px 14px;
            }

            .page-heading h2 {
                font-size:
                    25px;
            }

            .stats-grid {
                grid-template-columns:
                    1fr 1fr;

                gap:
                    10px;
            }

            .stat-card {
                padding:
                    15px;
            }

            .stat-value {
                font-size:
                    22px;
            }

            .controls {
                display:
                    grid;

                grid-template-columns:
                    1fr 1fr;
            }

            .search-box {
                grid-column:
                    1 / -1;
            }

            .filter-select {
                width:
                    100%;

                min-width:
                    0;
            }

            .refresh-btn {
                width:
                    100%;
            }

            .detail-grid {
                grid-template-columns:
                    1fr;
            }

            .detail-box.full {
                grid-column:
                    auto;
            }

        }

    </style>
</head>

<body>

<!-- =========================================================
     LOGIN
========================================================== -->

<section id="loginScreen">

    <div class="login-card">

        <div class="brand">

            <div class="brand-logo">
                P
            </div>

            <h1>
                Pro<span>Bee</span>
            </h1>

            <p>
                Secure Admin Dashboard
            </p>

        </div>


        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    Admin Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter admin email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                Login to Dashboard
            </button>

            <div id="loginMessage"></div>

        </form>

    </div>

</section>


<!-- =========================================================
     DASHBOARD
========================================================== -->

<section id="dashboard">

    <!-- TOP BAR -->

    <header class="topbar">

        <div class="topbar-left">

            <div class="mini-logo">
                P
            </div>

            <div class="topbar-title">
                Pro<span>Bee</span> Admin
            </div>

        </div>


        <div class="topbar-right">

            <span
                class="admin-email"
                id="adminEmail"
            ></span>

            <button
                class="logout-btn"
                id="logoutBtn"
            >
                Logout
            </button>

        </div>

    </header>


    <!-- MAIN -->

    <main class="main">

        <div class="page-heading">

            <h2>
                Order Dashboard
            </h2>

            <p>
                Manage and monitor ProBee customer orders.
            </p>

        </div>


        <!-- =================================================
             STATS
        ================================================== -->

        <div class="stats-grid">

            <div class="stat-card">

                <div class="stat-label">
                    Total Orders
                </div>

                <div
                    class="stat-value gold"
                    id="totalOrders"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    Completed Sales
                </div>

                <div
                    class="stat-value green"
                    id="totalSales"
                >
                    LKR 0
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    Pending
                </div>

                <div
                    class="stat-value yellow"
                    id="pendingOrders"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    Completed
                </div>

                <div
                    class="stat-value blue"
                    id="completedOrders"
                >
                    0
                </div>

            </div>

        </div>


        <!-- =================================================
             CONTROLS
        ================================================== -->

        <div class="controls">

            <div class="search-box">

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search order number, customer, WhatsApp or email..."
                >

            </div>


            <select
                id="statusFilter"
                class="filter-select"
            >

                <option value="all">
                    All Statuses
                </option>

                <option value="pending">
                    Pending
                </option>

                <option value="processing">
                    Processing
                </option>

                <option value="completed">
                    Completed
                </option>

                <option value="cancelled">
                    Cancelled
                </option>

            </select>


            <select
                id="dateFilter"
                class="filter-select"
            >

                <option value="all">
                    All Dates
                </option>

                <option value="today">
                    Today
                </option>

                <option value="7">
                    Last 7 Days
                </option>

                <option value="30">
                    Last 30 Days
                </option>

            </select>


            <button
                class="refresh-btn"
                id="refreshBtn"
            >
                ↻ Refresh
            </button>

        </div>


        <!-- =================================================
             ORDERS
        ================================================== -->

        <section class="orders-card">

            <div class="orders-header">

                <h3>
                    Customer Orders
                </h3>

                <span
                    class="orders-count"
                    id="ordersCount"
                >
                    0 orders
                </span>

            </div>


            <div class="table-wrap">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Order
                            </th>

                            <th>
                                Customer
                            </th>

                            <th>
                                Items
                            </th>

                            <th>
                                Total
                            </th>

                            <th>
                                Date
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                View
                            </th>

                        </tr>

                    </thead>


                    <tbody id="ordersBody">

                        <tr>

                            <td
                                colspan="7"
                                class="state-box"
                            >

                                Loading orders...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</section>


<!-- =========================================================
     ORDER MODAL
========================================================== -->

<div
    class="modal-overlay"
    id="orderModal"
>

    <div class="modal">

        <div class="modal-header">

            <h3>
                Order Details
            </h3>

            <button
                class="close-modal"
                id="closeModal"
            >
                ×
            </button>

        </div>


        <div
            class="modal-body"
            id="modalBody"
        >
        </div>


        <div class="modal-footer">

            <button
                class="whatsapp-btn"
                id="whatsappBtn"
            >
                Open WhatsApp
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================================

const SUPABASE_URL =
    "https://fjczxixfajvvizsywrtr.supabase.co";

/* =========================================================

let allOrders = [];

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


/* =========================================================
   CLEAN PHONE
========================================================= */

function cleanPhone(phone) {

    if (!phone) {
        return "";
    }

    let cleaned =
        String(phone)
            .replace(
                /[^\d+]/g,
                ""
            );

    if (
        cleaned.startsWith("0")
    ) {
        cleaned =
            "94" +
            cleaned.substring(1);
    }

    if (
        cleaned.startsWith("+")
    ) {
        cleaned =
            cleaned.substring(1);
    }

    return cleaned;
}


/* =========================================================
   FORMAT CURRENCY
========================================================= */

function formatCurrency(amount) {

    const number =
        Number(amount) || 0;

    return (
        "LKR " +
        number.toLocaleString(
            "en-LK",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        )
    );
}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(dateValue) {

    if (!dateValue) {
        return "-";
    }

    const date =
        new Date(dateValue);

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return "-";
    }

    return date.toLocaleString(
        "en-LK",
        {
            year: "numeric",
            month: "short",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}


/* =========================================================
   STATUS CLASS
========================================================= */

function getStatusClass(status) {

    switch (
        String(status || "")
            .toLowerCase()
    ) {

        case "processing":
            return "status-processing";

        case "completed":
            return "status-completed";

        case "cancelled":
            return "status-cancelled";

        default:
            return "status-pending";
    }
}


/* =========================================================
   STATUS LABEL
========================================================= */

function getStatusLabel(status) {

    const value =
        String(status || "pending")
            .toLowerCase();

    return value
        .charAt(0)
        .toUpperCase() +
        value.slice(1);
}


/* =========================================================
   LOGIN
========================================================= */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const email =
            document.getElementById(
                "email"
            ).value.trim();

        const password =
            document.getElementById(
                "password"
            ).value;

        loginMessage.textContent =
            "";

        loginMessage.className =
            "";

        loginBtn.disabled =
            true;

        loginBtn.textContent =
            "Signing in...";


        try {

            const {
                data,
                error
            } =
                await supabaseClient
                    .auth
                    .signInWithPassword({
                        email,
                        password
                    });


            if (error) {
                throw error;
            }


            if (!data.user) {
                throw new Error(
                    "Login failed."
                );
            }


            const {
                data: adminData,
                error: adminError
            } =
                await supabaseClient
                    .from("admin_users")
                    .select("user_id")
                    .eq(
                        "user_id",
                        data.user.id
                    )
                    .maybeSingle();


            if (
                adminError ||
                !adminData
            ) {

                await supabaseClient
                    .auth
                    .signOut();

                throw new Error(
                    "This account is not an authorized ProBee admin."
                );
            }


            showDashboard(
                data.user
            );

        }
        catch (error) {

            console.error(
                "Login error:",
                error
            );

            loginMessage.textContent =
                error.message ||
                "Login failed.";

            loginMessage.className =
                "error";

        }
        finally {

            loginBtn.disabled =
                false;

            loginBtn.textContent =
                "Login to Dashboard";

        }

    }
);


/* =========================================================
   SHOW DASHBOARD
========================================================= */

function showDashboard(user) {

    loginScreen.style.display =
        "none";

    dashboard.style.display =
        "block";

    adminEmail.textContent =
        user.email || "";

    loadOrders();
}


/* =========================================================
   CHECK SESSION
========================================================= */

async function checkSession() {

    try {

        const {
            data: {
                session
            }
        } =
            await supabaseClient
                .auth
                .getSession();


        if (
            session &&
            session.user
        ) {

            const {
                data: adminData
            } =
                await supabaseClient
                    .from("admin_users")
                    .select("user_id")
                    .eq(
                        "user_id",
                        session.user.id
                    )
                    .maybeSingle();


            if (adminData) {

                showDashboard(
                    session.user
                );

            }

        }

    }
    catch (error) {

        console.error(
            "Session check error:",
            error
        );

    }

}


/* =========================================================
   LOAD ORDERS
========================================================= */

async function loadOrders() {

    ordersBody.innerHTML = `
        <tr>
            <td colspan="7" class="state-box">
                <div class="state-icon">⏳</div>
                Loading orders...
            </td>
        </tr>
    `;


    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .from("orders")
                .select(
                    "id, order_number, customer_name, whatsapp, email, total, created_at, note, items, subtotal, delivery_fee, payment_method, order_status, tracking_token"
                )
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        if (error) {
            throw error;
        }


        allOrders =
            Array.isArray(data)
                ? data
                : [];


        updateStats();

        renderOrders();

    }
    catch (error) {

        console.error(
            "Orders error:",
            error
        );

        ordersBody.innerHTML = `
            <tr>
                <td colspan="7" class="state-box">
                    <div class="state-icon">⚠️</div>
                    Could not load orders.
                    <br>
                    <span class="muted">
                        ${escapeHtml(error.message)}
                    </span>
                </td>
            </tr>
        `;

    }

}


/* =========================================================
   UPDATE STATS
========================================================= */

function updateStats() {

    const total =
        allOrders.length;


    const pending =
        allOrders.filter(
            order =>
                String(
                    order.order_status ||
                    "pending"
                ).toLowerCase()
                === "pending"
        ).length;


    const completed =
        allOrders.filter(
            order =>
                String(
                    order.order_status ||
                    ""
                ).toLowerCase()
                === "completed"
        );


    const completedSales =
        completed.reduce(
            (
                sum,
                order
            ) =>
                sum +
                (
                    Number(
                        order.total
                    ) || 0
                ),
            0
        );


    totalOrders.textContent =
        total.toLocaleString(
            "en-LK"
        );

    pendingOrders.textContent =
        pending.toLocaleString(
            "en-LK"
        );

    completedOrders.textContent =
        completed.length.toLocaleString(
            "en-LK"
        );

    totalSales.textContent =
        formatCurrency(
            completedSales
        );

}


/* =========================================================
   GET FILTERED ORDERS
========================================================= */

function getFilteredOrders() {

    const search =
        searchInput.value
            .trim()
            .toLowerCase();

    const status =
        statusFilter.value;

    const date =
        dateFilter.value;


    const now =
        new Date();


    return allOrders.filter(
        order => {

            const orderStatus =
                String(
                    order.order_status ||
                    "pending"
                ).toLowerCase();


            const searchable =
                [
                    order.order_number,
                    order.customer_name,
                    order.whatsapp,
                    order.email
                ]
                .filter(Boolean)
                .join(" ")
                .toLowerCase();


            if (
                search &&
                !searchable.includes(
                    search
                )
            ) {
                return false;
            }


            if (
                status !== "all" &&
                orderStatus !== status
            ) {
                return false;
            }


            if (
                date !== "all"
            ) {

                const created =
                    new Date(
                        order.created_at
                    );


                if (
                    Number.isNaN(
                        created.getTime()
                    )
                ) {
                    return false;
                }


                if (
                    date === "today"
                ) {

                    if (
                        created.toDateString() !==
                        now.toDateString()
                    ) {
                        return false;
                    }

                }
                else {

                    const days =
                        Number(date);

                    const difference =
                        now.getTime() -
                        created.getTime();

                    const max =
                        days *
                        24 *
                        60 *
                        60 *
                        1000;


                    if (
                        difference > max
                    ) {
                        return false;
                    }

                }

            }


            return true;

        }
    );

}


/* =========================================================
   RENDER ORDERS
========================================================= */

function renderOrders() {

    const orders =
        getFilteredOrders();


    ordersCount.textContent =
        orders.length +
        (
            orders.length === 1
                ? " order"
                : " orders"
        );


    if (
        orders.length === 0
    ) {

        ordersBody.innerHTML = `
            <tr>
                <td colspan="7" class="state-box">
                    <div class="state-icon">📦</div>
                    No orders found.
                </td>
            </tr>
        `;

        return;
    }


    ordersBody.innerHTML =
        orders.map(
            order => {

                const status =
                    String(
                        order.order_status ||
                        "pending"
                    ).toLowerCase();


                const items =
                    parseItems(
                        order.items
                    );


                const itemsHtml =
                    items.length
                        ? items
                            .map(
                                item =>
                                    `${escapeHtml(
                                        getItemName(item)
                                    )} × ${escapeHtml(
                                        getItemQty(item)
                                    )}`
                            )
                            .join("<br>")
                        : "No item details";


                return `
                    <tr>

                        <td>

                            <div class="order-number">
                                ${escapeHtml(
                                    order.order_number
                                )}
                            </div>

                            <div class="muted">
                                ID: ${escapeHtml(
                                    order.id
                                )}
                            </div>

                        </td>


                        <td>

                            <div class="customer-name">
                                ${escapeHtml(
                                    order.customer_name
                                )}
                            </div>

                            <div class="muted">
                                ${escapeHtml(
                                    order.whatsapp
                                )}
                            </div>

                            <div class="muted">
                                ${escapeHtml(
                                    order.email
                                )}
                            </div>

                        </td>


                        <td>

                            <div class="items-list">
                                ${itemsHtml}
                            </div>

                        </td>


                        <td>

                            <div class="total">
                                ${formatCurrency(
                                    order.total
                                )}
                            </div>

                            <div class="muted">
                                ${escapeHtml(
                                    order.payment_method ||
                                    "pending"
                                )}
                            </div>

                        </td>


                        <td>

                            <div>
                                ${formatDate(
                                    order.created_at
                                )}
                            </div>

                        </td>


                        <td>

                            <select
                                class="status-select"
                                data-id="${escapeHtml(
                                    order.id
                                )}"
                            >

                                <option
                                    value="pending"
                                    ${status === "pending" ? "selected" : ""}
                                >
                                    Pending
                                </option>

                                <option
                                    value="processing"
                                    ${status === "processing" ? "selected" : ""}
                                >
                                    Processing
                                </option>

                                <option
                                    value="completed"
                                    ${status === "completed" ? "selected" : ""}
                                >
                                    Completed
                                </option>

                                <option
                                    value="cancelled"
                                    ${status === "cancelled" ? "selected" : ""}
                                >
                                    Cancelled
                                </option>

                            </select>

                            <div style="margin-top:7px;">
                                <span
                                    class="status-badge ${getStatusClass(status)}"
                                >
                                    ${getStatusLabel(status)}
                                </span>
                            </div>

                        </td>


                        <td>

                            <button
                                class="refresh-btn view-order-btn"
                                data-id="${escapeHtml(
                                    order.id
                                )}"
                                style="padding:8px 11px;"
                            >
                                View
                            </button>

                        </td>

                    </tr>
                `;

            }
        ).join("");


    attachOrderEvents();

}


/* =========================================================
   PARSE ITEMS
========================================================= */

function parseItems(items) {

    if (
        Array.isArray(items)
    ) {
        return items;
    }


    if (
        typeof items === "string"
    ) {

        try {

            const parsed =
                JSON.parse(items);

            return Array.isArray(
                parsed
            )
                ? parsed
                : [];

        }
        catch {
            return [];
        }

    }


    return [];

}


/* =========================================================
   ITEM NAME
========================================================= */

function getItemName(item) {

    if (!item) {
        return "Product";
    }

    return (
        item.name ||
        item.title ||
        item.product_name ||
        item.productName ||
        "Product"
    );

}


/* =========================================================
   ITEM QTY
========================================================= */

function getItemQty(item) {

    if (!item) {
        return 1;
    }

    return (
        item.quantity ??
        item.qty ??
        1
    );

}


/* =========================================================
   ITEM PRICE
========================================================= */

function getItemPrice(item) {

    if (!item) {
        return 0;
    }

    return Number(
        item.price ??
        item.unit_price ??
        item.amount ??
        0
    ) || 0;

}


/* =========================================================
   ATTACH ORDER EVENTS
========================================================= */

function attachOrderEvents() {

    document
        .querySelectorAll(
            ".status-select"
        )
        .forEach(
            select => {

                select.addEventListener(
                    "change",
                    function() {

                        const id =
                            this.dataset.id;

                        const newStatus =
                            this.value;

                        updateOrderStatus(
                            id,
                            newStatus
                        );

                    }
                );

            }
        );


    document
        .querySelectorAll(
            ".view-order-btn"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    function() {

                        const id =
                            this.dataset.id;

                        openOrderModal(
                            id
                        );

                    }
                );

            }
        );

}


/* =========================================================
   UPDATE ORDER STATUS
========================================================= */

async function updateOrderStatus(
    orderId,
    newStatus
) {

    try {

        const {
            error
        } =
            await supabaseClient
                .from("orders")
                .update({
                    order_status:
                        newStatus
                })
                .eq(
                    "id",
                    orderId
                );


        if (error) {
            throw error;
        }


        const order =
            allOrders.find(
                item =>
                    String(item.id) ===
                    String(orderId)
            );


        if (order) {

            order.order_status =
                newStatus;

        }


        updateStats();

        renderOrders();

    }
    catch (error) {

        console.error(
            "Status update error:",
            error
        );

        alert(
            "Could not update order status.\n\n" +
            error.message
        );

        renderOrders();

    }

}


/* =========================================================
   OPEN ORDER MODAL
========================================================= */

function openOrderModal(orderId) {

    const order =
        allOrders.find(
            item =>
                String(item.id) ===
                String(orderId)
        );


    if (!order) {
        return;
    }


    currentModalOrder =
        order;


    const items =
        parseItems(
            order.items
        );


    const itemsHtml =
        items.length
            ? items
                .map(
                    item => {

                        const name =
                            getItemName(
                                item
                            );

                        const qty =
                            Number(
                                getItemQty(
                                    item
                                )
                            ) || 1;

                        const price =
                            getItemPrice(
                                item
                            );


                        return `
                            <div class="modal-item">

                                <div>
                                    ${escapeHtml(
                                        name
                                    )}
                                    <span class="muted">
                                        × ${qty}
                                    </span>
                                </div>

                                <div>
                                    ${formatCurrency(
                                        price * qty
                                    )}
                                </div>

                            </div>
                        `;

                    }
                )
                .join("")
            : `
                <div class="modal-item">
                    No item details available.
                </div>
            `;


    const status =
        String(
            order.order_status ||
            "pending"
        ).toLowerCase();


    modalBody.innerHTML = `

        <div class="detail-grid">

            <div class="detail-box">

                <div class="detail-label">
                    Order Number
                </div>

                <div class="detail-value">
                    ${escapeHtml(
                        order.order_number
                    )}
                </div>

            </div>


            <div class="detail-box">

                <div class="detail-label">
                    Status
                </div>

                <div class="detail-value">

                    <span
                        class="status-badge ${getStatusClass(status)}"
                    >
                        ${getStatusLabel(status)}
                    </span>

                </div>

            </div>


            <div class="detail-box">

                <div class="detail-label">
                    Customer
                </div>

                <div class="detail-value">
                    ${escapeHtml(
                        order.customer_name
                    )}
                </div>

            </div>


            <div class="detail-box">

                <div class="detail-label">
                    WhatsApp
                </div>

                <div class="detail-value">
                    ${escapeHtml(
                        order.whatsapp
                    )}
                </div>

            </div>


            <div class="detail-box">

                <div class="detail-label">
                    Email
                </div>

                <div class="detail-value">
                    ${escapeHtml(
                        order.email
                    )}
                </div>

            </div>


            <div class="detail-box">

                <div class="detail-label">
                    Order Date
                </div>

                <div class="detail-value">
                    ${formatDate(
                        order.created_at
                    )}
                </div>

            </div>


            <div class="detail-box">

                <div class="detail-label">
                    Subtotal
                </div>

                <div class="detail-value">
                    ${formatCurrency(
                        order.subtotal
                    )}
                </div>

            </div>


            <div class="detail-box">

                <div class="detail-label">
                    Delivery
                </div>

                <div class="detail-value">
                    ${formatCurrency(
                        order.delivery_fee
                    )}
                </div>

            </div>


            <div class="detail-box">

                <div class="detail-label">
                    Payment
                </div>

                <div class="detail-value">
                    ${escapeHtml(
                        order.payment_method ||
                        "pending"
                    )}
                </div>

            </div>


            <div class="detail-box">

                <div class="detail-label">
                    Total
                </div>

                <div class="detail-value">
                    <strong>
                        ${formatCurrency(
                            order.total
                        )}
                    </strong>
                </div>

            </div>


            ${
                order.note
                    ? `
                        <div class="detail-box full">

                            <div class="detail-label">
                                Customer Note
                            </div>

                            <div class="detail-value">
                                ${escapeHtml(
                                    order.note
                                )}
                            </div>

                        </div>
                    `
                    : ""
            }

        </div>


        <div
            style="
                color:#aaa;
                font-size:12px;
                margin-bottom:9px;
            "
        >
            Ordered Products
        </div>


        <div class="modal-items">

            ${itemsHtml}

        </div>

    `;


    orderModal.classList.add(
        "show"
    );

}


/* =========================================================
   CLOSE MODAL
========================================================= */

function closeOrderModal() {

    orderModal.classList.remove(
        "show"
    );

    currentModalOrder =
        null;

}


closeModal.addEventListener(
    "click",
    closeOrderModal
);


orderModal.addEventListener(
    "click",
    function(event) {

        if (
            event.target ===
            orderModal
        ) {
            closeOrderModal();
        }

    }
);


/* =========================================================
   WHATSAPP
========================================================= */

whatsappBtn.addEventListener(
    "click",
    function() {

        if (
            !currentModalOrder
        ) {
            return;
        }


        const phone =
            cleanPhone(
                currentModalOrder.whatsapp
            );


        if (!phone) {

            alert(
                "No WhatsApp number available."
            );

            return;
        }


        const message =
            "Hello " +
            (
                currentModalOrder.customer_name ||
                "Customer"
            ) +
            ", this is ProBee regarding your order " +
            (
                currentModalOrder.order_number ||
                ""
            ) +
            ".";


        const url =
            "https://wa.me/" +
            phone +
            "?text=" +
            encodeURIComponent(
                message
            );


        window.open(
            url,
            "_blank"
        );

    }
);


/* =========================================================
   SEARCH / FILTER
========================================================= */

searchInput.addEventListener(
    "input",
    renderOrders
);

statusFilter.addEventListener(
    "change",
    renderOrders
);

dateFilter.addEventListener(
    "change",
    renderOrders
);


/* =========================================================
   REFRESH
========================================================= */

refreshBtn.addEventListener(
    "click",
    loadOrders
);


/* =========================================================
   LOGOUT
========================================================= */

logoutBtn.addEventListener(
    "click",
    async function() {

        await supabaseClient
            .auth
            .signOut();

        dashboard.style.display =
            "none";

        loginScreen.style.display =
            "flex";

        loginForm.reset();

        allOrders = [];

    }
);


/* =========================================================
   AUTH STATE
========================================================= */

supabaseClient
    .auth
    .onAuthStateChange(
        function(
            event,
            session
        ) {

            if (
                event ===
                "SIGNED_OUT"
            ) {

                dashboard.style.display =
                    "none";

                loginScreen.style.display =
                    "flex";

            }

        }
    );


/* =========================================================
   START
========================================================= */

checkSession();

</script>
