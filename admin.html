<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ProBee Admin</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #080808;
            color: #fff;
            min-height: 100vh;
        }

        button,
        input,
        select {
            font: inherit;
        }

        /* =========================
           LOGIN
        ========================= */

        #loginPage {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: #111;
            border: 1px solid #292929;
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,.5);
        }

        .logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo h1 {
            color: #d6ad4b;
            font-size: 32px;
            letter-spacing: 2px;
        }

        .logo p {
            color: #888;
            margin-top: 6px;
            font-size: 13px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 13px;
        }

        .field input {
            width: 100%;
            padding: 14px 15px;
            border-radius: 10px;
            border: 1px solid #333;
            background: #080808;
            color: #fff;
            outline: none;
        }

        .field input:focus {
            border-color: #d6ad4b;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #d6ad4b;
            color: #080808;
            font-weight: 700;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #e7c366;
        }

        #loginError {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 9px;
            background: rgba(180, 40, 40, .15);
            border: 1px solid #642b2b;
            color: #ff8f8f;
            font-size: 13px;
        }

        /* =========================
           DASHBOARD
        ========================= */

        #dashboard {
            display: none;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 20;
            background: rgba(8,8,8,.95);
            border-bottom: 1px solid #222;
            backdrop-filter: blur(12px);
        }

        .header-inner {
            max-width: 1400px;
            margin: auto;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            color: #d6ad4b;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .admin-label {
            color: #777;
            font-size: 12px;
            margin-left: 8px;
        }

        .logout-btn {
            border: 1px solid #333;
            background: #111;
            color: #ddd;
            padding: 9px 15px;
            border-radius: 8px;
            cursor: pointer;
        }

        .logout-btn:hover {
            border-color: #d6ad4b;
            color: #d6ad4b;
        }

        .container {
            max-width: 1400px;
            margin: auto;
            padding: 28px 24px 50px;
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .title h2 {
            font-size: 28px;
        }

        .title p {
            color: #777;
            font-size: 13px;
            margin-top: 5px;
        }

        .stats {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .stat {
            min-width: 125px;
            padding: 14px 17px;
            background: #111;
            border: 1px solid #252525;
            border-radius: 12px;
        }

        .stat span {
            display: block;
            color: #777;
            font-size: 11px;
            margin-bottom: 5px;
        }

        .stat strong {
            font-size: 20px;
            color: #d6ad4b;
        }

        /* =========================
           SEARCH
        ========================= */

        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .search {
            flex: 1;
            min-width: 220px;
        }

        .search input {
            width: 100%;
            padding: 13px 15px;
            background: #111;
            color: #fff;
            border: 1px solid #292929;
            border-radius: 10px;
            outline: none;
        }

        .search input:focus {
            border-color: #d6ad4b;
        }

        .refresh-btn {
            padding: 13px 18px;
            background: #111;
            border: 1px solid #333;
            border-radius: 10px;
            color: #ddd;
            cursor: pointer;
        }

        .refresh-btn:hover {
            border-color: #d6ad4b;
            color: #d6ad4b;
        }

        /* =========================
           ORDERS
        ========================= */

        .orders {
            display: grid;
            gap: 14px;
        }

        .order-card {
            background: #111;
            border: 1px solid #242424;
            border-radius: 15px;
            overflow: hidden;
        }

        .order-head {
            padding: 17px 19px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
            border-bottom: 1px solid #222;
        }

        .order-number {
            color: #d6ad4b;
            font-weight: 700;
            font-size: 15px;
        }

        .order-date {
            color: #777;
            font-size: 12px;
            margin-top: 5px;
        }

        .status {
            border: 1px solid #444;
            background: #080808;
            color: #ddd;
            padding: 8px 10px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
        }

        .status:focus {
            border-color: #d6ad4b;
        }

        .order-body {
            padding: 19px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .customer h3,
        .items h3 {
            font-size: 13px;
            color: #888;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: .5px;
        }

        .customer p {
            margin-bottom: 7px;
            color: #ddd;
            font-size: 14px;
            word-break: break-word;
        }

        .customer a {
            color: #d6ad4b;
            text-decoration: none;
        }

        .item {
            padding: 10px 0;
            border-bottom: 1px solid #222;
            display: flex;
            justify-content: space-between;
            gap: 15px;
            font-size: 13px;
        }

        .item:last-child {
            border-bottom: 0;
        }

        .item-name {
            color: #ddd;
        }

        .item-meta {
            color: #777;
            font-size: 11px;
            margin-top: 3px;
        }

        .item-price {
            color: #ddd;
            white-space: nowrap;
        }

        .order-footer {
            border-top: 1px solid #222;
            padding: 15px 19px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

        .note {
            color: #999;
            font-size: 12px;
            max-width: 70%;
        }

        .total {
            color: #d6ad4b;
            font-size: 18px;
            font-weight: 700;
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            background: #111;
            border: 1px solid #222;
            border-radius: 15px;
            color: #777;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #888;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 700px) {

            .header-inner {
                padding: 15px;
            }

            .brand {
                font-size: 20px;
            }

            .admin-label {
                display: none;
            }

            .container {
                padding: 20px 14px 40px;
            }

            .title h2 {
                font-size: 23px;
            }

            .stats {
                width: 100%;
            }

            .stat {
                flex: 1;
                min-width: 0;
            }

            .order-body {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .order-footer {
                align-items: flex-start;
            }

            .note {
                max-width: 100%;
            }

            .logout-btn {
                padding: 8px 11px;
            }
        }
    </style>
</head>

<body>

<!-- =========================
     LOGIN PAGE
========================= -->

<div id="loginPage">

    <div class="login-box">

        <div class="logo">
            <h1>ProBee</h1>
            <p>Admin Dashboard</p>
        </div>

        <form id="loginForm">

            <div class="field">
                <label for="email">Admin Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter admin email"
                    required
                >
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >
            </div>

            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                Login
            </button>

            <div id="loginError"></div>

        </form>

    </div>

</div>


<!-- =========================
     ADMIN DASHBOARD
========================= -->

<div id="dashboard">

    <header>

        <div class="header-inner">

            <div>
                <span class="brand">ProBee</span>
                <span class="admin-label">ADMIN PANEL</span>
            </div>

            <button
                class="logout-btn"
                id="logoutBtn"
            >
                Logout
            </button>

        </div>

    </header>


    <main class="container">

        <div class="top-row">

            <div class="title">
                <h2>Orders</h2>
                <p>Manage customer orders</p>
            </div>

            <div class="stats">

                <div class="stat">
                    <span>Total Orders</span>
                    <strong id="totalOrders">0</strong>
                </div>

                <div class="stat">
                    <span>Pending</span>
                    <strong id="pendingOrders">0</strong>
                </div>

                <div class="stat">
                    <span>Completed</span>
                    <strong id="completedOrders">0</strong>
                </div>

            </div>

        </div>


        <div class="toolbar">

            <div class="search">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search order, customer, WhatsApp or email..."
                >
            </div>

            <button
                class="refresh-btn"
                id="refreshBtn"
            >
                ↻ Refresh
            </button>

        </div>


        <div id="ordersContainer">

            <div class="loading">
                Loading orders...
            </div>

        </div>

    </main>

</div>


<script>

    /* =========================================
       SUPABASE CONFIG
    ========================================= */

    const SUPABASE_URL =
        'https://fjczxixfajvvizsywrtr.supabase.co';

    const SUPABASE_ANON_KEY =
        'sb_publishable_UkqBPcpXJVhl4PVvpniI2Q_zoe_e_MN';

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


    /* =========================================
       ELEMENTS
    ========================================= */

    const loginPage =
        document.getElementById('loginPage');

    const dashboard =
        document.getElementById('dashboard');

    const loginForm =
        document.getElementById('loginForm');

    const loginBtn =
        document.getElementById('loginBtn');

    const loginError =
        document.getElementById('loginError');

    const logoutBtn =
        document.getElementById('logoutBtn');

    const ordersContainer =
        document.getElementById('ordersContainer');

    const searchInput =
        document.getElementById('searchInput');

    const refreshBtn =
        document.getElementById('refreshBtn');

    const totalOrders =
        document.getElementById('totalOrders');

    const pendingOrders =
        document.getElementById('pendingOrders');

    const completedOrders =
        document.getElementById('completedOrders');


    let allOrders = [];


    /* =========================================
       LOGIN
    ========================================= */

    loginForm.addEventListener('submit', async function(event) {

        event.preventDefault();

        loginError.style.display = 'none';

        const email =
            document.getElementById('email').value.trim();

        const password =
            document.getElementById('password').value;

        loginBtn.disabled = true;
        loginBtn.textContent = 'Logging in...';

        const { data, error } =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

        if (error) {

            loginError.textContent =
                'Login failed: ' + error.message;

            loginError.style.display = 'block';

            loginBtn.disabled = false;
            loginBtn.textContent = 'Login';

            return;
        }

        await showDashboard();

    });


    /* =========================================
       SHOW DASHBOARD
    ========================================= */

    async function showDashboard() {

        loginPage.style.display = 'none';
        dashboard.style.display = 'block';

        await loadOrders();

    }


    /* =========================================
       LOAD ORDERS
    ========================================= */

    async function loadOrders() {

        ordersContainer.innerHTML =
            '<div class="loading">Loading orders...</div>';

        const { data, error } =
            await supabaseClient
                .from('orders')
                .select('*')
                .order('created_at', {
                    ascending: false
                });

        if (error) {

            console.error(error);

            ordersContainer.innerHTML = `
                <div class="empty">
                    <h3>Could not load orders</h3>
                    <p style="margin-top:8px;">
                        ${escapeHtml(error.message)}
                    </p>
                </div>
            `;

            return;
        }

        allOrders = data || [];

        updateStats();

        renderOrders(allOrders);

    }


    /* =========================================
       STATS
    ========================================= */

    function updateStats() {

        const pending =
            allOrders.filter(order =>
                order.order_status === 'pending'
            ).length;

        const completed =
            allOrders.filter(order =>
                order.order_status === 'completed'
            ).length;

        totalOrders.textContent =
            allOrders.length;

        pendingOrders.textContent =
            pending;

        completedOrders.textContent =
            completed;
    }


    /* =========================================
       RENDER ORDERS
    ========================================= */

    function renderOrders(orders) {

        if (!orders.length) {

            ordersContainer.innerHTML = `
                <div class="empty">
                    <h3>No orders found</h3>
                    <p style="margin-top:8px;">
                        Customer orders will appear here.
                    </p>
                </div>
            `;

            return;
        }

        ordersContainer.innerHTML =
            '<div class="orders">' +
            orders.map(createOrderCard).join('') +
            '</div>';

    }


    /* =========================================
       ORDER CARD
    ========================================= */

    function createOrderCard(order) {

        const items =
            Array.isArray(order.items)
                ? order.items
                : [];

        const itemsHtml =
            items.length
                ? items.map(item => {

                    const quantity =
                        Number(item.quantity || 1);

                    const price =
                        Number(item.price || 0);

                    return `
                        <div class="item">

                            <div>
                                <div class="item-name">
                                    ${escapeHtml(item.name || 'Product')}
                                </div>

                                <div class="item-meta">
                                    ${escapeHtml(item.plan || '')}
                                    × ${quantity}
                                </div>
                            </div>

                            <div class="item-price">
                                LKR ${(price * quantity).toLocaleString()}
                            </div>

                        </div>
                    `;

                }).join('')
                : `
                    <div style="color:#777;font-size:13px;">
                        No item information
                    </div>
                `;


        const date =
            order.created_at
                ? new Date(order.created_at).toLocaleString()
                : 'Unknown date';


        const status =
            order.order_status || 'pending';


        return `
            <div class="order-card">

                <div class="order-head">

                    <div>
                        <div class="order-number">
                            ${escapeHtml(order.order_number || 'No Order Number')}
                        </div>

                        <div class="order-date">
                            ${escapeHtml(date)}
                        </div>
                    </div>


                    <select
                        class="status"
                        onchange="changeStatus(${Number(order.id)}, this.value)"
                    >

                        <option value="pending"
                            ${status === 'pending' ? 'selected' : ''}>
                            Pending
                        </option>

                        <option value="processing"
                            ${status === 'processing' ? 'selected' : ''}>
                            Processing
                        </option>

                        <option value="completed"
                            ${status === 'completed' ? 'selected' : ''}>
                            Completed
                        </option>

                        <option value="cancelled"
                            ${status === 'cancelled' ? 'selected' : ''}>
                            Cancelled
                        </option>

                    </select>

                </div>


                <div class="order-body">

                    <div class="customer">

                        <h3>Customer</h3>

                        <p>
                            <strong>
                                ${escapeHtml(order.customer_name || '')}
                            </strong>
                        </p>

                        <p>
                            WhatsApp:
                            <a
                                href="https://wa.me/${cleanPhone(order.whatsapp)}"
                                target="_blank"
                            >
                                ${escapeHtml(order.whatsapp || '')}
                            </a>
                        </p>

                        <p>
                            Email:
                            ${escapeHtml(order.email || '')}
                        </p>

                    </div>


                    <div class="items">

                        <h3>Products</h3>

                        ${itemsHtml}

                    </div>

                </div>


                <div class="order-footer">

                    <div class="note">
                        ${
                            order.note
                                ? 'Note: ' + escapeHtml(order.note)
                                : 'No customer note'
                        }
                    </div>

                    <div class="total">
                        LKR ${Number(order.total || 0).toLocaleString()}
                    </div>

                </div>

            </div>
        `;
    }


    /* =========================================
       CHANGE ORDER STATUS
    ========================================= */

    async function changeStatus(orderId, newStatus) {

        const { error } =
            await supabaseClient
                .from('orders')
                .update({
                    order_status: newStatus
                })
                .eq('id', orderId);

        if (error) {

            alert(
                'Could not update order status.\n\n' +
                error.message
            );

            await loadOrders();

            return;
        }

        const order =
            allOrders.find(item =>
                Number(item.id) === Number(orderId)
            );

        if (order) {
            order.order_status = newStatus;
        }

        updateStats();

    }


    /* =========================================
       SEARCH
    ========================================= */

    searchInput.addEventListener(
        'input',
        function() {

            const query =
                this.value.trim().toLowerCase();

            if (!query) {

                renderOrders(allOrders);

                return;
            }

            const filtered =
                allOrders.filter(order => {

                    const text = [

                        order.order_number,
                        order.customer_name,
                        order.whatsapp,
                        order.email,
                        order.order_status

                    ]
                    .join(' ')
                    .toLowerCase();

                    return text.includes(query);

                });

            renderOrders(filtered);

        }
    );


    /* =========================================
       REFRESH
    ========================================= */

    refreshBtn.addEventListener(
        'click',
        loadOrders
    );


    /* =========================================
       LOGOUT
    ========================================= */

    logoutBtn.addEventListener(
        'click',
        async function() {

            await supabaseClient.auth.signOut();

            dashboard.style.display = 'none';
            loginPage.style.display = 'flex';

            loginForm.reset();

        }
    );


    /* =========================================
       SESSION CHECK
    ========================================= */

    async function checkSession() {

        const { data } =
            await supabaseClient.auth.getSession();

        if (data.session) {

            await showDashboard();

        } else {

            loginPage.style.display = 'flex';
            dashboard.style.display = 'none';

        }

    }


    /* =========================================
       SECURITY HELPERS
    ========================================= */

    function escapeHtml(value) {

        return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');

    }


    function cleanPhone(phone) {

        return String(phone || '')
            .replace(/[^\d]/g, '');

    }


    /* =========================================
       START
    ========================================= */

    checkSession();

</script>

</body>
</html>
